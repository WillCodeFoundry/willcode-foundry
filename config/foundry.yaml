# The projects and roles foundry knows. It refuses any not listed here.
name: willcode-foundry

projects:
  # <name>: { url: <ssh clone url> }   -- used as `foundry run <name> <role> <task>`
  tkt-store:
    url: git@github.com:WillCodeFoundry/tkt-store.git
  willcode-foundry:
    url: git@github.com:WillCodeFoundry/willcode-foundry.git
  foundry-test:
    url: git@github.com:WillCodeFoundry/foundry-test.git
roles:
  # Each role maps to {}, or {model: <model>} to run its agent on that model, such as
  # {model: opus} or {model: claude-sonnet-5-5}. Without one, Claude Code's default.
  # It applies from the next launch: see docs/adr/0014-a-role-s-model-is-given-at-launch.md.
  planner: {}
  dev: {}
  qa: {}
  reviewer: {}
  architect: {}
