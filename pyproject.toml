[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry"
version = "0.1.0"
description = "willcode-foundry: run coding agents in Docker Sandboxes, one role per task."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.15", "ruff>=0.8", "types-PyYAML"]

[tool.uv]
default-groups = []

[project.scripts]
foundry = "foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The docker and sbx tiers run only when asked for, with -m docker or -m sbx: a later -m replaces this one.
addopts = "-q --strict-markers -m 'not docker and not sbx'"
markers = [
    "docker: runs session-init in the sandbox's template image; needs a Docker daemon",
    "sbx: runs a real sbx sandbox; by hand only, see README",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "PLW", "TID252", "N", "A"]
ignore = [
    "N818",  # an exception is named for what happened, such as a refusal, not always an error
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["input"]   # git.py and tests/support take input= as subprocess.run does

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"   # the default, "parents", would still allow `from . import x`

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Test functions take fixtures as parameters; annotating each would mean
# importing the test doubles from conftest. Their bodies are still checked.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# The test doubles themselves stay fully typed.
module = ["tests.agent_sandbox.conftest"]
disallow_untyped_defs = true
