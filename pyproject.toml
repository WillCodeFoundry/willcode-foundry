[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry"
version = "0.1.0"
description = "willcode-foundry: run coding agents in Docker Sandboxes, one role per task."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "mypy>=1.15", "ruff>=0.8", "types-PyYAML", "vulture>=2.14", "pylint>=3.3", "shellcheck-py>=0.10"]

[tool.uv]
default-groups = []

[project.scripts]
foundry = "foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The docker and sbx tiers run only when asked for, with -m docker or -m sbx: a later -m replaces this one.
addopts = "-q --strict-markers -m 'not docker and not sbx'"
markers = [
    "docker: runs session-init in the sandbox's template image; needs a Docker daemon",
    "sbx: runs a real sbx sandbox; by hand only, see README",
]
xfail_strict = true
filterwarnings = ["error"]

# Used by CI's test job, which runs the host tier with --cov. Code no test reaches is code no test holds,
# so CI fails when coverage drops below fail_under. Raise it as coverage rises; lower it only with a reason.
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 97
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "RUF", "PLW", "TID252", "N", "A",
    # Smells a tool can see. Each catches something that has had to be undone in real code.
    "ARG",                                    # parameters nobody reads
    "BLE", "S110", "S112",                    # blanket except, and except that passes or continues (design rule 6)
    "TRY002", "TRY201", "TRY203", "TRY300", "TRY301", "TRY400",  # raising, re-raising and logging exceptions
    "S101",                                   # assert in production code, which -O removes
    "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # functions that every change grows
    "FBT",                                    # boolean flags that pick a behaviour
    "SLF",                                    # reaching into another object's private members
    "T20",                                    # print outside the entry points (design rule 6)
    "ERA",                                    # commented-out code
    "PGH",                                    # blanket type: ignore and noqa
    "ASYNC",                                  # blocking calls in async code
    "S113", "S301", "S307", "S324", "S501", "S506",  # unsafe calls: no timeout, pickle, eval, weak hashes, no TLS check, yaml.load
    "PT011", "PT012", "PT015", "PT017", "PT027",  # pytest.raises too broad or too wide, asserts that can't fail
    "SIM", "RET", "PIE", "C4",                # simpler forms of the same code
    "TID251",                                 # banned APIs, below
]
ignore = [
    "N818",    # an exception is named for what happened, such as a refusal, not always an error
    "ARG005",  # a lambda passed as a callback takes the arguments its caller passes
    "SIM300",  # flags tests that compare a module constant with its expected value
]

[tool.ruff.lint.per-file-ignores]
# Test functions take fixtures for their effect, and fakes take the arguments the protocol they stand in for does.
"tests/**" = ["ARG", "FBT", "S101", "PLR0913", "PLR0917"]
# The entry points: the only modules that print, or write to sys.stdout or sys.stderr (design rule 6).
"src/foundry/cli.py" = ["T20", "TID251"]
"src/foundry/commands/*" = ["T20", "TID251"]
"src/agent_runtime/__main__.py" = ["T20", "TID251"]
"src/agent_runtime/commands/*" = ["T20", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Tests never patch: fake the outside system instead, as design rule 3 in ARCHITECTURE.md says."
# T20 misses print(file=<an expression>) and sys.stderr.write; banning the streams catches both.
"sys.stdout".msg = "Only entry points write here: log progress to the module's logger, as design rule 6 says."
"sys.stderr".msg = "Only entry points write here: log progress to the module's logger, as design rule 6 says."

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["input"]   # git.py and tests/support take input= as subprocess.run does

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"   # the default, "parents", would still allow `from . import x`

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "unused-awaitable",
    "redundant-self",
    "mutable-override",
    "exhaustive-match",
]

[[tool.mypy.overrides]]
# Test functions take fixtures as parameters; annotating each would mean
# importing the test doubles from conftest. Their bodies are still checked.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# The test doubles themselves stay fully typed.
module = ["tests.agent_sandbox.conftest"]
disallow_untyped_defs = true

[tool.vulture]
# Unused code across the package: functions, classes, attributes and parameters nothing reads.
paths = ["src"]
min_confidence = 60
ignore_names = ["external_attr"]  # runtime_build.py sets it on a ZipInfo, which zipfile reads

[tool.pylint.main]
# Only the duplicate-code check runs (CONTRIBUTING.md); ruff covers the rest.
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
min-similarity-lines = 5
